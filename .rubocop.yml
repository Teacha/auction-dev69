# Base: Rails Omakase (รวม rubocop-rails และ rubocop-performance แล้ว)
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

plugins:
  - rubocop-rspec
  - rubocop-rspec_rails

AllCops:
  NewCops: enable
  Exclude:
    - "bin/**/*"
    - "db/*schema.rb"
    - "vendor/**/*"
    - "node_modules/**/*"
    - "tmp/**/*"

# request spec มักต้อง assert หลายอย่างต่อ 1 flow
RSpec/MultipleExpectations:
  Max: 3

RSpec/ExampleLength:
  Max: 15
